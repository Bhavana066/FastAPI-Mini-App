<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary · StudyAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/style.css?v=3" rel="stylesheet">
</head>
<body>
  {% include "workspace_nav.html" %}
  <main class="container py-4 py-lg-5" data-material-id="{{ material_id }}">
    <header class="dashboard-head">
      <div>
        <p class="section-kicker mb-2">Study notes</p>
        <h1 class="h2 mb-1" id="pdfTitle">PDF Summary</h1>
        <p class="text-secondary mb-0" id="uploadedDate"></p>
      </div>
      <a class="btn btn-outline-primary rounded-pill" href="/materials/{{ material_id }}/quiz"><i class="bi bi-ui-checks me-1" aria-hidden="true"></i>Open Quiz</a>
    </header>
    <div class="summary-actions mb-3">
      <button class="btn btn-outline-secondary rounded-pill" id="copySummary" type="button"><i class="bi bi-clipboard me-1" aria-hidden="true"></i>Copy</button>
      <button class="btn btn-outline-secondary rounded-pill" id="downloadSummary" type="button"><i class="bi bi-download me-1" aria-hidden="true"></i>Download</button>
      <button class="btn btn-outline-secondary rounded-pill" id="printSummary" type="button"><i class="bi bi-printer me-1" aria-hidden="true"></i>Print</button>
      <button class="btn btn-primary rounded-pill" id="generateSummary" type="button">
        <span class="btn-text"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Generate Again</span>
        <span class="spinner-border spinner-border-sm d-none" role="status" aria-label="Generating summary"></span>
      </button>
    </div>
    <div id="alertBox" role="status" aria-live="polite"></div>
    <section id="summaryContent" class="card summary-content" aria-live="polite">
      <p class="text-secondary p-4 mb-0">Loading summary...</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js?v=4"></script>
</body>
</html>
