<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · StudyAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/style.css?v=4" rel="stylesheet">
</head>
<body>
  {% include "workspace_nav.html" %}
  <main class="container-xl py-4 py-lg-5">
    <section class="dashboard-head">
      <div>
        <p class="section-kicker mb-2">Your study workspace</p>
        <h1 id="welcome">Welcome</h1>
        <p class="text-secondary mb-0">Your PDFs, summaries, and practice quizzes in one place.</p>
      </div>
      <a class="btn btn-primary rounded-pill px-3" href="/upload"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Upload New PDF</a>
    </section>

    <section class="row g-3 stats-grid" aria-label="Study activity">
      <div class="col-sm-6 col-lg-4"><div class="card stat-card h-100"><span class="stat-icon"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i></span><div><div class="stat-label">Total PDFs</div><div class="stat-value" id="statPdfs">0</div></div></div></div>
      <div class="col-sm-6 col-lg-4"><div class="card stat-card h-100"><span class="stat-icon"><i class="bi bi-journal-text" aria-hidden="true"></i></span><div><div class="stat-label">Total Summaries</div><div class="stat-value" id="statSummaries">0</div></div></div></div>
      <div class="col-sm-6 col-lg-4"><div class="card stat-card h-100"><span class="stat-icon"><i class="bi bi-ui-checks" aria-hidden="true"></i></span><div><div class="stat-label">Total Quizzes</div><div class="stat-value" id="statQuizzes">0</div></div></div></div>
    </section>

    <section aria-labelledby="materialsHeading">
      <div class="section-heading">
        <div><p class="section-kicker mb-1">Library</p><h2 id="materialsHeading">Recent study materials</h2></div>
        <span class="text-secondary small" id="materialCount" aria-live="polite"></span>
      </div>
      <div class="material-toolbar">
        <label class="material-search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input class="form-control" id="materialSearch" type="search" placeholder="Search materials..." aria-label="Search materials">
        </label>
        <div class="filter-tabs" role="group" aria-label="Filter materials">
          <button class="active" type="button" data-material-filter="all" aria-pressed="true">All</button>
          <button type="button" data-material-filter="recent" aria-pressed="false">Recent</button>
          <button type="button" data-material-filter="summarized" aria-pressed="false">Summarized</button>
          <button type="button" data-material-filter="quiz" aria-pressed="false">Quiz available</button>
        </div>
        <label class="visually-hidden" for="materialSort">Sort materials</label>
        <select class="form-select" id="materialSort" aria-label="Sort materials">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
      <div id="materialList" class="row g-3" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js?v=4"></script>
</body>
</html>
