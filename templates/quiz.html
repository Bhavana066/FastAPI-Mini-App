<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz · StudyAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/style.css?v=3" rel="stylesheet">
</head>
<body>
  {% include "workspace_nav.html" %}
  <main class="container py-4 py-lg-5" data-material-id="{{ material_id }}">
    <header class="dashboard-head mb-4">
      <div>
        <p class="section-kicker mb-2">Practice and recall</p>
        <h1 class="h2 mb-1" id="pdfTitle">Quiz</h1>
        <p class="text-secondary mb-0">Choose the best answer for each question.</p>
      </div>
      <button class="btn btn-primary rounded-pill" id="generateQuiz" type="button">
        <span class="btn-text"><i class="bi bi-stars me-1" aria-hidden="true"></i>Generate Quiz</span>
        <span class="spinner-border spinner-border-sm d-none" role="status" aria-label="Generating quiz"></span>
      </button>
    </header>
    <div id="alertBox" role="status" aria-live="polite"></div>
    <section id="quizBox" class="card quiz-shell p-3 p-md-4" aria-live="polite">
      <p class="text-secondary mb-0">Loading quiz...</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js?v=4"></script>
</body>
</html>
